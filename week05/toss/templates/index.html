<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상품 결제</title>
    <!-- 토스페이먼츠 SDK v2 (결제위젯 전용) -->
    <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body style="padding: 30px; font-family: sans-serif;">
    <h1>상품 결제</h1>
    
    <!-- 결제UI 및 약관 영역 -->
    <div id="payment-method"></div>
    <div id="agreement"></div>
    
    <button id="payment-button" style="margin-top: 20px; width: 100%; padding: 15px; font-size: 18px; background-color: #3182f6; color: white; border: none; border-radius: 8px; cursor: pointer;">
        결제하기
    </button>

    <script>
        async function main() {
            // 토스 결제위젯 공식 테스트 클라이언트 키 (v2 전용)
            const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
            const tossPayments = TossPayments(clientKey);
            
            // 결제위젯 초기화
            const widgets = tossPayments.widgets({
                customerKey: TossPayments.ANONYMOUS
            });

            // 금액 설정 (1,000원)
            await widgets.setAmount({
                currency: "KRW",
                value: 1000,
            });

            // 결제 수단 및 약관 위젯 렌더링
            await Promise.all([
                widgets.renderPaymentMethods({
                    selector: "#payment-method",
                    variantKey: "DEFAULT"
                }),
                widgets.renderAgreement({
                    selector: "#agreement",
                    variantKey: "AGREEMENT"
                })
            ]);

            // 결제하기 버튼 클릭
            document.getElementById("payment-button").addEventListener("click", async function () {
                try {
                    await widgets.requestPayment({
                        orderId: "order_" + new Date().getTime(),
                        orderName: "테스트 상품",
                        successUrl: window.location.origin + "/success",
                        failUrl: window.location.origin + "/fail",
                    });
                } catch (error) {
                    console.error(error);
                }
            });
        }
        main();
    </script>
</body>
</html>
